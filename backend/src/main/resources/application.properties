spring.application.name=marketplace
# HTTP 服务端口和中文响应编码。
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 内存数据库无需单独安装；连接关闭后仍保留，应用进程退出后数据丢失。
spring.datasource.url=jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 启动时执行 classpath 中的建表脚本；脚本执行失败会阻止应用启动。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# 浏览器访问 /h2-console 可查看数据，仅允许本机访问控制台。
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
