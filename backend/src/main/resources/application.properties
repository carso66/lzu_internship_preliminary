spring.application.name=demo

# ---------------------------------------------------------------------------
# 数据源：H2 内存库。评审在 backend/ 下 `mvn spring-boot:run` 即可起服务，
# 不需要外部数据库、不需要手动建库。schema.sql 自带 DROP + CREATE，可重复执行。
# 如需持久化，把 url 改成 jdbc:h2:file:./data/market 即可。
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:market;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 启动时执行手写的 backend/schema.sql（DDL）+ backend/data.sql（种子数据）。
# 路径相对工作目录（backend/），所以必须在 backend/ 下启动。
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./schema.sql
spring.sql.init.data-locations=file:./data.sql
spring.sql.init.encoding=UTF-8

# 统一响应里的中文按 UTF-8 输出
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

