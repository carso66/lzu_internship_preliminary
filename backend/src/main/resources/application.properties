spring.application.name=marketplace

# ---------- 端口 ----------
# 用 8081：这台机器 8080 已经被别的程序占了。
# 换到 8080 空着的环境，改成 8080 后记得同步改 SUBMISSION.md 里的地址。
server.port=8081

# ---------- 数据库（H2 内存库）----------
# 每次启动都是干净的初始数据，评审看到的结果和你本机一致。
# DB_CLOSE_DELAY=-1：最后一个连接关掉后不销毁库。
# MODE=MySQL：让 H2 兼容 MySQL 的语法习惯，以后换 MySQL 不用改 SQL。
spring.datasource.url=jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- 建表脚本 ----------
# 脚本放在 backend/schema.sql（题目要求的位置），启动时自动执行。
# 路径是相对启动目录的：所以必须在 backend/ 目录下启动服务。
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./schema.sql
spring.sql.init.encoding=UTF-8

# ---------- H2 控制台（调试用）----------
# 启动后浏览器打开 http://localhost:8081/h2-console
# JDBC URL 填 jdbc:h2:mem:marketplace，用户名 sa，密码空
spring.h2.console.enabled=true
