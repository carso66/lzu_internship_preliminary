server:
  port: 8080

spring:
  datasource:
    # DB_CLOSE_DELAY=-1：连接池反复开关时内存库不被销毁
    # LOCK_TIMEOUT=10000：并发下单抢同一行时等锁而不是立刻抛错
    url: jdbc:h2:mem:market;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: info
