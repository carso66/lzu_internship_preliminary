spring:
  application:
    name: campus-marketplace

  datasource:
    url: jdbc:h2:file:./data/marketplace;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080

logging:
  level:
    org.springframework.jdbc.core: info
    org.flywaydb: info
