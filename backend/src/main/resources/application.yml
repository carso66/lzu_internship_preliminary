# 应用、H2 数据源与启动初始化。运行命令的工作目录为 backend/。
spring:
  application:
    name: marketplace
  # H2 数据仅保留在当前 JVM 内。DB_CLOSE_DELAY=-1 使最后一个连接关闭时仍保留数据。
  datasource:
    url: jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # 应用和 Spring 测试上下文启动时都执行幂等建表脚本。
      mode: always
      # 相对路径以 JVM 工作目录为基准，从 backend/ 启动即可找到 schema.sql。
      schema-locations: file:./schema.sql
      # 固定以 UTF-8 读取脚本，避免 Windows 平台默认 GBK 编码导致中文注释乱码
      encoding: UTF-8

# HTTP 服务默认端口。
server:
  port: 8080
