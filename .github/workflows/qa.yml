name: QA

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Start SUT, run pytest, and stop SUT
        run: |
          set -euo pipefail

          mkdir -p testing/自动化/reports
          python testing/sut/app.py --port 18081 > sut.log 2>&1 &
          sut_pid=$!

          cleanup() {
            kill "$sut_pid" 2>/dev/null || true
            wait "$sut_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/health; then
              ready=1
              echo "SUT is ready"
              break
            fi

            if ! kill -0 "$sut_pid" 2>/dev/null; then
              echo "SUT exited during startup" >&2
              cat sut.log >&2
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "SUT did not become healthy" >&2
            cat sut.log >&2
            exit 1
          fi

          (
            cd testing/自动化
            SUT_BASE_URL=http://127.0.0.1:18081 pytest -q --junitxml=reports/pytest.xml
          )

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-artifacts
          path: |
            sut.log
            testing/自动化/reports/pytest.xml
          if-no-files-found: warn
