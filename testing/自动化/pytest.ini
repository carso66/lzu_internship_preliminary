[pytest]
; Entry-point config for the automation suite. Because this file lives in the
; automation directory, pytest treats it as rootdir, so running pytest from the
; repo root or from this directory collects the same 83 items.
;
; An ini file (instead of tox.ini / setup.cfg) is enough here: this directory
; only holds tests, there is no package to build.
;
; NOTE: keep this file ASCII-only. iniconfig reads ini files with the platform
; default encoding (GBK on zh-CN Windows), so any non-ASCII byte in a comment
; makes pytest abort with UnicodeDecodeError before collecting anything.
testpaths = .
python_files = test_*.py
python_functions = test_*

; -ra makes the short summary list every xfail together with its reason.
; All 25 xfails map to defect ids BUG-01..BUG-16, so one run is enough to see
; which cases are waiting on which defect.
addopts = -ra

; Keep this in sync with @pytest.mark.xfail(strict=True) in the cases: once the
; SUT is fixed an xfail turns into a failure, which forces the marker to be
; removed instead of silently reporting green.
xfail_strict = true